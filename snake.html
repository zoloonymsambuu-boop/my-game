<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nokia Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #111827;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header h1 {
      font-size: 1.8rem;
      color: #10b981;
      letter-spacing: 2px;
    }
    .score-board {
      font-size: 1.1rem;
      font-weight: bold;
      color: #e5e7eb;
    }
    /* Nokia-гийн ногоон өнгөт дэлгэц */
    canvas {
      border: 4px solid #374151;
      border-radius: 8px;
      background-color: #9bbc0f;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 260px;
    }
    .btn {
      background: #1f2937;
      color: #fff;
      border: 2px solid #374151;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }
    .btn:active {
      background: #10b981;
    }
    .btn-up {
      grid-column: 2;
    }
    .btn-left {
      grid-column: 1;
    }
    .btn-right {
      grid-column: 3;
    }
    .btn-down {
      grid-column: 2;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header">
      <h1>SNAKE</h1>
      <div class="score-board">Оноо: <span id="score">0</span></div>
    </div>

    <!-- Дэлгэцийн өндрийг багтаамжтайгаар 240px тохируулсан -->
    <canvas id="snakeGame" width="240" height="240"></canvas>

    <div class="controls">
      <div class="btn btn-up" id="btn-up">▲</div>
      <div class="btn btn-left" id="btn-left">◀</div>
      <div class="btn btn-right" id="btn-right">▶</div>
      <div class="btn btn-down" id="btn-down">▼</div>
    </div>
  </div>

  <script>
    const CANVAS = document.getElementById('snakeGame');
    const CTX = CANVAS.getContext('2d');
    const SCORE_ELEMENT = document.getElementById('score');

    const GRID_SIZE = 15; // Тоглоомын сетканы хэмжээ (15x15)
    const TILE_COUNT = CANVAS.width / GRID_SIZE; // 16px нэг блок

    // --- 1. SNAKE CLASS (МОГОЙ) ---
    class Snake {
      constructor() {
        this.reset();
      }

      reset() {
        this.body = [
          { x: 5, y: 5 },
          { x: 4, y: 5 },
          { x: 3, y: 5 }
        ];
        this.dirX = 1;
        this.dirY = 0;
      }

      changeDirection(x, y) {
        // Замдаа шууд буцах хөдөлгөөн хийлгэхгүй
        if (this.dirX === -x && this.dirY === -y) return;
        this.dirX = x;
        this.dirY = y;
      }

      move() {
        const head = {
          x: this.body[0].x + this.dirX,
          y: this.body[0].y + this.dirY
        };
        this.body.unshift(head);
      }

      popTail() {
        this.body.pop();
      }

      checkCollision() {
        const head = this.body[0];

        // Хана мөргөх шалгалт
        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
          return true;
        }

        // Өөрийнхөө биеийг мөргөх шалгалт
        for (let i = 1; i < this.body.length; i++) {
          if (head.x === this.body[i].x && head.y === this.body[i].y) {
            return true;
          }
        }

        return false;
      }

      draw() {
        CTX.fillStyle = '#0f380f'; // Сонгод Nokia өнгө
        this.body.forEach((segment, index) => {
          CTX.fillRect(
            segment.x * GRID_SIZE + 1,
            segment.y * GRID_SIZE + 1,
            GRID_SIZE - 2,
            GRID_SIZE - 2
          );
        });
      }
    }

    // --- 2. FOOD CLASS (ХООЛ) ---
    class Food {
      constructor() {
        this.spawn([]);
      }

      spawn(snakeBody) {
        let validLocation = false;
        while (!validLocation) {
          this.x = Math.floor(Math.random() * TILE_COUNT);
          this.y = Math.floor(Math.random() * TILE_COUNT);

          validLocation = !snakeBody.some(segment => segment.x === this.x && segment.y === this.y);
        }
      }

      draw() {
        CTX.fillStyle = '#8bac0f';
        CTX.fillRect(
          this.x * GRID_SIZE + 1,
          this.y * GRID_SIZE + 1,
          GRID_SIZE - 2,
          GRID_SIZE - 2
        );
      }
    }

    // --- 3. GAME CLASS (УДИРДЛАГА) ---
    class Game {
      constructor() {
        this.snake = new Snake();
        this.food = new Food();
        this.score = 0;
        this.gameOver = false;
        this.speed = 120; // Тоглоомын хурд (мс)

        this.initControls();
      }

      start() {
        this.gameLoop = setInterval(() => this.update(), this.speed);
      }

      update() {
        if (this.gameOver) return;

        this.snake.move();

        // Хоол идсэн эсэхийг шалгах
        const head = this.snake.body[0];
        if (head.x === this.food.x && head.y === this.food.y) {
          this.score += 10;
          SCORE_ELEMENT.innerText = this.score;
          this.food.spawn(this.snake.body);
        } else {
          this.snake.popTail();
        }

        // Мөргөлдөөн шалгах
        if (this.snake.checkCollision()) {
          this.gameOver = true;
          clearInterval(this.gameLoop);
          alert(`GAME OVER! Таны оноо: ${this.score}`);
          this.restart();
          return;
        }

        this.draw();
      }

      restart() {
        this.snake.reset();
        this.score = 0;
        SCORE_ELEMENT.innerText = this.score;
        this.food.spawn(this.snake.body);
        this.gameOver = false;
        this.start();
      }

      draw() {
        CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
        this.food.draw();
        this.snake.draw();
      }

      initControls() {
        // Гарны суман товчлуур
        document.addEventListener('keydown', e => {
          if (e.key === 'ArrowUp') this.snake.changeDirection(0, -1);
          else if (e.key === 'ArrowDown') this.snake.changeDirection(0, 1);
          else if (e.key === 'ArrowLeft') this.snake.changeDirection(-1, 0);
          else if (e.key === 'ArrowRight') this.snake.changeDirection(1, 0);
        });

        // Дэлгэцийн товчлуур (Mobile)
        document.getElementById('btn-up').onclick = () => this.snake.changeDirection(0, -1);
        document.getElementById('btn-down').onclick = () => this.snake.changeDirection(0, 1);
        document.getElementById('btn-left').onclick = () => this.snake.changeDirection(-1, 0);
        document.getElementById('btn-right').onclick = () => this.snake.changeDirection(1, 0);
      }
    }

    const game = new Game();
    game.start();
  </script>

</body>
</html>
